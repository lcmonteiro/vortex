# CMake CI for vortex, on GCC and Clang.
#
# Two jobs:
#
#   format   every tracked C++ file matches .clang-format, checked with the clang-format the
#            repository is formatted with (18), so a newer one's opinions are not a failure
#   build    on each compiler, in two configurations, both with warnings as errors:
#              release   Release
#              sanitize  Debug, with AddressSanitizer and UndefinedBehaviorSanitizer
#
# Windows/MSVC is not in the matrix. vortex's math::solve_ldlt/solve_cholesky call LAPACK's
# dsysv_/dpotrf_/dpotrs_ directly, and every vcpkg-based way tried so far to provide a working
# BLAS/LAPACK on Windows hit the same Fortran/C ABI mismatch around LAPACK's hidden
# character-argument string-length parameters (see e.g. https://github.com/scipy/scipy/issues/10335,
# https://blog.r-project.org/2019/05/15/gfortran-issues-with-lapack/) -- it shows up as "On entry to
# DGEMM parameter number 1 had an illegal value". Re-enable once someone with a real Windows/MSVC
# environment can iterate on it directly; openblas from vcpkg is the most promising lead.
#
# The runner is pinned, not ubuntu-latest, so that the compilers and clang-format it ships do not
# change under the repository between one push and the next.
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A newer push to the same branch or pull request makes the run for the older one moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Install clang-format 18
      run: sudo apt-get update && sudo apt-get install -y clang-format-18

    - name: Check formatting
      # --Werror turns each difference into a failure; the diff it would make is in the log.
      run: git ls-files '*.hpp' '*.cpp' '*.h' | xargs clang-format-18 --dry-run --Werror

  build:
    runs-on: ubuntu-24.04

    strategy:
      # Feedback for every combination, not just the first that breaks.
      fail-fast: false

      matrix:
        compiler: [gcc, clang]
        config: [release, sanitize]
        include:
          - compiler: gcc
            c_compiler: gcc
            cpp_compiler: g++
          - compiler: clang
            c_compiler: clang
            cpp_compiler: clang++
          - config: release
            build_type: Release
            options: -DVORTEX_WARNINGS_AS_ERRORS=ON
          - config: sanitize
            build_type: Debug
            options: -DVORTEX_WARNINGS_AS_ERRORS=ON -DVORTEX_SANITIZE=ON

    name: build (${{ matrix.compiler }}, ${{ matrix.config }})

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install BLAS/LAPACK
      # libclang-rt-18-dev carries clang's sanitizer runtimes; gcc's ship with the compiler.
      run: |
        sudo apt-get update
        sudo apt-get install -y libblas-dev liblapack-dev
        if [ "${{ matrix.compiler }}" = clang ]; then sudo apt-get install -y libclang-rt-18-dev; fi

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        ${{ matrix.options }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # --output-on-failure prints each failing test's full stdout/stderr in the Actions log, so a
      # failure - a sanitizer report included - is debuggable from the CI output alone.
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

    - name: Upload test log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ctest-log-${{ matrix.compiler }}-${{ matrix.config }}
        path: ${{ steps.strings.outputs.build-output-dir }}/Testing/Temporary/LastTest.log
        if-no-files-found: ignore
